<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>CRM-IMPERA — sem conexão</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 30%, #241f12 0%, #0b0b0c 62%); color: #ececee;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    .caixa { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    h1 { margin: 6px 0 0; font-size: 19px; letter-spacing: .08em; color: #e0be6c; }
    p { margin: 0; color: #a5a5ad; line-height: 1.5; font-size: 15px; }
    a.botao {
      margin-top: 8px; padding: 12px 22px; border-radius: 12px; font-weight: 600; text-decoration: none;
      background: linear-gradient(180deg, #f0d48c, #c9a24c); color: #15130c;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <img src="icones/icone-192.png" alt="" />
    <h1>CRM-IMPERA</h1>
    <p>Sem conexão com a internet agora. Assim que o sinal voltar, o CRM abre normalmente.</p>
    <a class="botao" href="./">Tentar de novo</a>
  </div>
</body>
</html>

# CRM Impera — app + banco de dados
# Os dados ficam FORA desta pasta (no SSD, em ../dados), então atualizar o app nunca toca no banco.

name: crm-impera

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (rode ./instalar.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${HOST_DATA_DIR:-../dados}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      FILES_DIR: /data/arquivos
    volumes:
      - ${HOST_FILES_DIR:-../arquivos}:/data/arquivos
    ports:
      # Só acessível pela própria máquina; o acesso externo passa pelo Tailscale Funnel (Mac) ou pelo proxy HTTPS (VPS)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
